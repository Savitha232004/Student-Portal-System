<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Attendance Report</title>

    <link rel="stylesheet" href="daily-report.css">
</head>

<body>

    <div class="container">

        <div class="page-header">
            <div>
                <h1>Daily Attendance Report</h1>
                <p>View and export daily student attendance records</p>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-section">

            <div class="filter-group">
                <label for="attendanceDate">Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div class="filter-group">
                <label for="department">Department</label>
                <select id="department">
                    <option value="">All Departments</option>
                    <option value="CSE">Computer Science</option>
                    <option value="ECE">Electronics</option>
                    <option value="EEE">Electrical</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="section">Section</label>
                <select id="section">
                    <option value="">All Sections</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="status">Status</label>
                <select id="status">
                    <option value="">All Status</option>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Late">Late</option>
                    <option value="On Leave">On Leave</option>
                </select>
            </div>

            <div class="filter-buttons">
                <button onclick="generateReport()" class="btn primary">
                    Generate Report
                </button>

                <button onclick="resetFilters()" class="btn secondary">
                    Reset
                </button>
            </div>

        </div>

        <!-- Summary -->
        <div class="summary-container">

            <div class="summary-card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="summary-card present">
                <h3>Present</h3>
                <p id="presentCount">0</p>
            </div>

            <div class="summary-card absent">
                <h3>Absent</h3>
                <p id="absentCount">0</p>
            </div>

            <div class="summary-card late">
                <h3>Late</h3>
                <p id="lateCount">0</p>
            </div>

            <div class="summary-card leave">
                <h3>On Leave</h3>
                <p id="leaveCount">0</p>
            </div>

        </div>

        <!-- Export -->
        <div class="report-header">

            <h2>Attendance Records</h2>

            <div>
                <button onclick="exportCSV()" class="btn export">
                    Export CSV
                </button>

                <button onclick="window.print()" class="btn export">
                    Export PDF
                </button>
            </div>

        </div>

        <!-- Attendance Table -->
        <div class="table-container">

            <table id="attendanceTable">

                <thead>
                    <tr>
                        <th>Sl. No</th>
                        <th>Student ID</th>
                        <th>Student Name</th>
                        <th>Department</th>
                        <th>Section</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="attendanceBody">
                </tbody>

            </table>

            <p id="noRecords" class="no-records">
                No attendance records found.
            </p>

        </div>

    </div>

    <script src="daily-report.js"></script>

</body>

</html>
