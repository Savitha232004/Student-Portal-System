<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Attendance Report</title>

    <link rel="stylesheet" href="student-report.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="page-header">

            <div>
                <h1>Student Attendance Report</h1>
                <p>View and export attendance details for individual students</p>
            </div>

        </div>


        <!-- Filters -->
        <div class="filter-section">

            <div class="filter-group">

                <label for="student">
                    Student
                </label>

                <select id="student">

                    <option value="">
                        Select Student
                    </option>

                    <option value="STU001">
                        Rahul Kumar - STU001
                    </option>

                    <option value="STU002">
                        Priya Sharma - STU002
                    </option>

                    <option value="STU003">
                        Arun Kumar - STU003
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="subject">
                    Subject
                </label>

                <select id="subject">

                    <option value="">
                        All Subjects
                    </option>

                    <option value="DBMS">
                        DBMS
                    </option>

                    <option value="OS">
                        Operating Systems
                    </option>

                    <option value="CN">
                        Computer Networks
                    </option>

                    <option value="AI">
                        Artificial Intelligence
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="fromDate">
                    From Date
                </label>

                <input type="date" id="fromDate">

            </div>


            <div class="filter-group">

                <label for="toDate">
                    To Date
                </label>

                <input type="date" id="toDate">

            </div>


            <div class="filter-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="">
                        All Status
                    </option>

                    <option value="Present">
                        Present
                    </option>

                    <option value="Absent">
                        Absent
                    </option>

                    <option value="Late">
                        Late
                    </option>

                    <option value="On Leave">
                        On Leave
                    </option>

                </select>

            </div>


            <div class="button-group">

                <button class="btn primary" onclick="generateReport()">

                    Generate Report

                </button>


                <button class="btn secondary" onclick="resetFilters()">

                    Reset

                </button>

            </div>

        </div>


        <!-- Student Information -->

        <div id="studentInfo" class="student-info">

            <h2 id="studentName">
                Select a student
            </h2>

            <p id="studentId">
                Student ID: -
            </p>

        </div>


        <!-- Summary -->

        <div class="summary-container">

            <div class="summary-card">

                <h3>Total Classes</h3>

                <p id="totalClasses">
                    0
                </p>

            </div>


            <div class="summary-card present">

                <h3>Total Present</h3>

                <p id="totalPresent">
                    0
                </p>

            </div>


            <div class="summary-card absent">

                <h3>Total Absent</h3>

                <p id="totalAbsent">
                    0
                </p>

            </div>


            <div class="summary-card percentage">

                <h3>Attendance %</h3>

                <p id="attendancePercentage">
                    0%
                </p>

            </div>

        </div>


        <!-- Report Header -->

        <div class="report-header">

            <h2>
                Attendance Records
            </h2>

            <div>

                <button class="btn export" onclick="exportCSV()">

                    Export CSV

                </button>


                <button class="btn export" onclick="exportPDF()">

                    Export PDF

                </button>

            </div>

        </div>


        <!-- Attendance Table -->

        <div class="table-container">

            <table id="studentReportTable">

                <thead>

                    <tr>

                        <th>Sl. No</th>
                        <th>Date</th>
                        <th>Subject</th>
                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="reportBody">

                </tbody>

            </table>


            <p id="noRecords" class="no-records">

                Select a student and generate the report.

            </p>

        </div>

    </div>


    <script src="student-report.js"></script>

</body>

</html>
